name: Actualizar precios

on:
  schedule:
    # Lunes a viernes, 18:10 y 22:10 UTC (después del cierre oficial LME en Londres)
    - cron: "10 18 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios
        run: python scripts/update_prices.py
      - name: Guardar cambios
        run: |
          git config user.name "metales-bot"
          git config user.email "metales-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          git push
