<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Metales</title>
  <meta name="theme-color" content="#0f1216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metales">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Metales</h1>
      <p class="sub" id="updated">Cargando…</p>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <section class="cards" id="cards" aria-label="Resumen"></section>

    <section class="detail" id="detail" aria-live="polite">
      <div class="detail-head">
        <div>
          <h2 id="d-name">—</h2>
          <p class="sub" id="d-meta">—</p>
        </div>
        <div class="range" id="range" role="tablist">
          <button data-days="22">1M</button>
          <button data-days="66" class="on">3M</button>
          <button data-days="130">6M</button>
          <button data-days="260">1A</button>
          <button data-days="9999">Todo</button>
        </div>
      </div>

      <div class="chart-wrap" id="chart-wrap">
        <svg id="chart" width="100%" preserveAspectRatio="none"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>

      <dl class="stats" id="stats"></dl>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="app.js"></script>
</body>
</html>
